name: Release

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  release:
    name: Prepare release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # The release tag is the version: v2.1.0 and 2.1.0 both become 2.1.0.
      - name: Set the version from the release tag
        id: version
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          VERSION="${TAG#v}"
          if ! echo "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'; then
            echo "Release tag '$TAG' is not a semver version (e.g. v2.1.0)" >&2
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          npm version "$VERSION" --no-git-tag-version --allow-same-version
      # The built file reads its version from package.json, so build after the bump.
      - name: Build the file
        run: |
          npm ci
          npm run build
      # The uploaded asset is named after the file: radial-menu.js
      - name: Upload build file to the release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/radial-menu.js

  bump-version:
    name: Bump version on the default branch
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Bump package.json to the release version
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          VERSION="${TAG#v}"
          if ! echo "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'; then
            echo "Release tag '$TAG' is not a semver version (e.g. v2.1.0)" >&2
            exit 1
          fi
          npm version "$VERSION" --no-git-tag-version --allow-same-version
      - name: Commit and push the bump
        env:
          TAG: ${{ github.event.release.tag_name }}
          BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          if git diff --quiet; then
            echo "Version already up to date; nothing to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "chore: bump version to ${TAG#v} [skip ci]"
          git push origin "HEAD:$BRANCH"
