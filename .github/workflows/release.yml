name: Release

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  release:
    name: Prepare release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Build the file
        run: |
          npm ci
          npm run build
      # The uploaded asset is named after the file: radial-menu.js
      - name: Upload build file to the release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/radial-menu.js
